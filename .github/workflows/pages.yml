name: Deploy to GitHub Pages

# Publishes the static site (repo root) to GitHub Pages on every push to main.
# No build step — it's plain HTML/CSS/JS.

on:
  push:
    # `main` is canonical, but the auto-created github-pages environment's
    # deployment-branch policy was pinned to this working branch when Pages
    # was first enabled, so we trigger here too to satisfy that gate.
    branches: [main, claude/elegant-thompson-hnlkdd]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Turn on GitHub Pages for the repo if it isn't already, so no
          # manual Settings click is needed for the first deploy.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
