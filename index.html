<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="A knowledge-graph skill tree for the 12-month performance / kernel engineering roadmap. Tick your progress, watch the graph light up." />
  <title>Perf Engineering — Skill Tree</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">⚡</span>
      <div>
        <h1 id="title">Performance Engineering</h1>
        <p id="subtitle">12 months → frontier-lab performance / kernel engineer</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="progress-meter" title="Overall completion">
        <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        <div class="progress-stat"><span id="progress-pct">0%</span><span id="progress-count" class="muted"></span></div>
      </div>
      <button id="reset-btn" class="ghost-btn" title="Clear all progress">Reset</button>
    </div>
  </header>

  <main class="stage">
    <svg id="graph" role="img" aria-label="Roadmap knowledge graph" preserveAspectRatio="xMidYMin meet"></svg>
    <button id="maint-btn" class="maint-btn" title="Weekly maintenance deck">↻ Weekly deck</button>
  </main>

  <!-- Slide-in detail drawer -->
  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <p id="drawer-tag" class="drawer-tag"></p>
        <h2 id="drawer-title"></h2>
        <p id="drawer-goal" class="muted"></p>
      </div>
      <button id="drawer-close" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div class="drawer-progress"><div id="drawer-bar" class="drawer-bar"></div></div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
